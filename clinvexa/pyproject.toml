[build-system]
requires = ["setuptools>=81,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "clinvexa"
version = "0.1.0"
description = "CLINVEXA medical desktop orchestration layer."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.104.0,<1",
    "PyYAML>=6.0,<7",
    "pydantic>=2.12.0,<3",
    "uvicorn[standard]>=0.24.0,<1",
]

[project.scripts]
clinvexa = "clinvexa.main:main"

[project.optional-dependencies]
live-voice = ["sherpa-onnx==1.13.4", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]
